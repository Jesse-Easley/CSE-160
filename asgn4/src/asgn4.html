<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Assignment 4: Lighting</title>

    <script src="../lib/webgl-utils.js"></script>
    <script src="../lib/webgl-debug.js"></script>
    <script src="../lib/cuon-utils.js"></script>
    <script src="../lib/cuon-matrix-cse160.js"></script>

    <script src="asgn4.js"></script>

    <script src="Renderer.js"></script>
    <script src="TextureManager.js"></script>
    <script src="SceneManager.js"></script>
    <script src="SceneObject.js"></script>
    <script src="Camera.js"></script>
    <script src="Material.js"></script>
    <script src="ObjLoader.js"></script>

    <script src="Mesh.js"></script>
    <script src="Cube.js"></script>
    <script src="Icosahedron.js"></script>
    <script src="Sphere.js"></script>

</head>
<body onload="main()">
    <div style="display: flex; gap: 20px; margin: 0px;"> 
        <div id="canvasContainer" style="position: relative; width: 600px; height: 600px;">
            <canvas id="webgl" width="600px" height="600px" style="display: block; position:absolute; z-index: 0;">Canvas not loaded!</canvas>
            <canvas id="hud" width="600px" height="600px" style="display: block; position:absolute; z-index: 1; pointer-events: none;">Hud not loaded!</canvas>
        </div>
        <div>
            <div>Jesse Easley</div>
            <div>jeeasley@ucsc.edu</div>
        </div>
    </div>
    <div>
        <span id="fps"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <label for="fovSlider">FOV: </label>
        <input type="range" id="fovSlider" min="30" max="120" value="60">
        <span id="fovValue">60</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <label for="noClip">no clip:</label>
        <input type="checkbox" id="noClip">
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <label for="lightToggle">Toggle Lighting:</label>
        <input type="checkbox" id="lightToggle" checked>

        <label for="normalToggle">Toggle Normals:</label>
        <input type="checkbox" id="normalToggle">
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <input type="color" id="lightColorPicker" value="#FFEAD1" />
        <label for="lightColorPicker">Light Color</label>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <label for="kaSlider">ka: </label>
        <input type="range" id="kaSlider" min="0" max="1" value="1" step="0.1">
        <span id="kaValue">1.0</span>

        <label for="kdSlider">kd: </label>
        <input type="range" id="kdSlider" min="0" max="1" value="1" step="0.1">
        <span id="kdValue">1.0</span>

        <label for="ksSlider">ks: </label>
        <input type="range" id="ksSlider" min="0" max="1" value="1" step="0.1">
        <span id="ksValue">1.0</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <label for="shininessSlider">Shininess: </label>
        <input type="range" id="shininessSlider" min="1" max="64" value="32">
        <span id="shininessValue">32.0</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <label for="lightMoveToggle">Point Light Movement:</label>
        <input type="checkbox" id="lightMoveToggle" checked>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        Point Light (Blue)
        <label>X <input type="range" id="pointLightX" min="-40" max="40" step="0.1"></label>
        <label>Y <input type="range" id="pointLightY" min="0" max="40" step="0.1"></label>
        <label>Z <input type="range" id="pointLightZ" min="-40" max="40" step="0.1"></label>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        Spot Light (Red)
        <label>X <input type="range" id="spotLightX" min="-20" max="20" value="0" step="0.1"></label>
        <label>Y <input type="range" id="spotLightY" min="0" max="20" value="5" step="0.1"></label>
        <label>Z <input type="range" id="spotLightZ" min="-20" max="20" value="0" step="0.1"></label>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <label>Inner <input type="range" id="spotLightInner" min="0" max="60" value="30" step="0.1"></label>
        <label>Outer <input type="range" id="spotLightOuter" min="0" max="80" value="80" step="0.1"></label>
        <label>Falloff <input type="range" id="spotLightFalloff" min="1" max="32" value="1" step="0.1"></label>
    </div>
</body>
</html>
